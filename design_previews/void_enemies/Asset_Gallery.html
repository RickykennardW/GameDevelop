<!doctype html><meta charset="utf-8"><title>Void common enemies — full animation gallery</title><style>body{background:#161122;color:#eee5ff;font:15px system-ui;margin:24px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px}article{padding:12px;border:1px solid #605075;border-radius:12px;background:#2a203e}img{display:block;width:170px;height:170px;object-fit:contain;margin:auto}p,small{color:#c2b1d7}button{background:#47315f;color:white;padding:8px 18px;border:1px solid #9376ad;border-radius:6px}.section{margin-top:25px}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>Void Guard / Sentinel / Brute</h1><p>Only Idle, Move, Hit, Death. Four actual directional paintings. Sword/shield visual equipment only.</p><button id="play">Pause</button><div id="all"></div><script>
const units=[['void_guard','Void Guard',150,70,10,8],['void_sentinel','Void Sentinel',120,85,0,6],['void_brute','Void Brute',220,60,15,10]],directions=['Up','Down','Left','Right'],states=['Idle','Move','Hit','Death'];const cards=[];let running=true,time=0,previous=performance.now();document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'Pause':'Play'};
for(const [slug,name,hp,speed,armor,gold] of units){const section=document.createElement('section');section.className='section';section.innerHTML='<h2>'+name+'</h2><p>'+hp+'HP · '+speed+' speed · '+armor+' armor · '+gold+'Gold</p><div class="grid"></div>';document.getElementById('all').appendChild(section);for(const state of states)for(const dir of directions){const a=document.createElement('article');a.innerHTML='<b>'+state+' / '+dir+'</b><img><small>Native128×128 RGBA; four ordered frames</small>';section.querySelector('.grid').appendChild(a);cards.push({img:a.querySelector('img'),path:'../../assets/enemies/'+slug+'/'+state+'_'+dir+'_',slug,state,last:-1});}}
function tick(now){if(running)time+=(now-previous)/1000;previous=now;for(const card of cards){const period=card.state==='Idle'?1.2:card.state==='Move'?(card.slug==='void_brute'?1.05:card.slug==='void_guard'?.72:.64):card.state==='Hit'?.16:.65,frame=Math.floor(time/period*4)%4;if(frame!==card.last){card.img.src=card.path+frame+'.png';card.last=frame;}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
